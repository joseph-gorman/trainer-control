<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CadenceCore — Direct Trainer & Zone 2 Controller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b1120; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { background-color: #131c31; border: 1px solid #1e293b; border-radius: 0.75rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto">

  <!-- Header -->
  <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-slate-800 gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-cyan-400"></span> CadenceCoreV4
      </h1>
      <p class="text-xs text-slate-400 mt-1">Direct FTMS Trainer, Zone 2 HR Controller & Cadence Monitor</p>
    </div>
    
    <!-- Pairing Mode Selector -->
    <div class="flex items-center gap-2 bg-slate-900/80 p-2 rounded-lg border border-slate-800 text-xs">
      <span class="text-slate-400">Scan Mode:</span>
      <select id="scanMode" class="bg-slate-800 text-cyan-300 font-medium rounded px-2 py-1 outline-none border border-slate-700">
        <option value="all" selected>Show All BLE Devices (iPad/Bluefy Safe)</option>
        <option value="filtered">Filtered Service UUIDs Only</option>
      </select>
    </div>
  </header>

  <!-- Connection Controls Grid (3 Devices) -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-6">
    <!-- Trainer Card -->
    <div class="card p-4 flex flex-col justify-between">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Smart Trainer (FTMS)</span>
        <span id="trainerStatus" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Disconnected</span>
      </div>
      <div class="flex gap-2">
        <button id="btnConnectTrainer" onclick="handleConnectTrainer()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 px-3 rounded text-xs transition">
          Connect Trainer
        </button>
        <button id="btnDisconnectTrainer" onclick="disconnectTrainer()" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-300 py-2 px-2.5 rounded text-xs transition">
          Disconnect
        </button>
      </div>
    </div>

    <!-- HR Monitor Card -->
    <div class="card p-4 flex flex-col justify-between">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Heart Rate (0x180D)</span>
        <span id="hrStatus" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Disconnected</span>
      </div>
      <div class="flex gap-2">
        <button id="btnConnectHR" onclick="handleConnectHR()" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 px-3 rounded text-xs transition">
          Connect HR
        </button>
        <button id="btnDisconnectHR" onclick="disconnectHR()" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-300 py-2 px-2.5 rounded text-xs transition">
          Disconnect
        </button>
      </div>
    </div>

    <!-- Cadence Sensor Card -->
    <div class="card p-4 flex flex-col justify-between">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Cadence (CSC 0x1816)</span>
        <span id="cadenceStatus" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Disconnected</span>
      </div>
      <div class="flex gap-2">
        <button id="btnConnectCadence" onclick="handleConnectCadence()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-3 rounded text-xs transition">
          Connect Cadence
        </button>
        <button id="btnDisconnectCadence" onclick="disconnectCadence()" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-300 py-2 px-2.5 rounded text-xs transition">
          Disconnect
        </button>
      </div>
    </div>
  </div>

  <!-- Realtime Telemetry Grid -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
    <div class="card p-4 text-center">
      <span class="text-xs text-rose-400 font-medium">HEART RATE</span>
      <div class="text-3xl sm:text-4xl font-bold mt-1 text-white mono"><span id="valHR">--</span> <span class="text-xs text-slate-500 font-normal">BPM</span></div>
      <div id="zoneBadge" class="text-[10px] mt-1 text-slate-500">Standby</div>
    </div>
    <div class="card p-4 text-center">
      <span class="text-xs text-cyan-400 font-medium">POWER</span>
      <div class="text-3xl sm:text-4xl font-bold mt-1 text-white mono"><span id="valPower">--</span> <span class="text-xs text-slate-500 font-normal">WATTS</span></div>
      <div class="text-[10px] mt-1 text-slate-500">Instantaneous</div>
    </div>
    <div class="card p-4 text-center">
      <span class="text-xs text-emerald-400 font-medium">CADENCE</span>
      <div class="text-3xl sm:text-4xl font-bold mt-1 text-white mono"><span id="valCadence">--</span> <span class="text-xs text-slate-500 font-normal">RPM</span></div>
      <div id="cadenceSource" class="text-[10px] mt-1 text-slate-500">No Source</div>
    </div>
    <div class="card p-4 text-center">
      <span class="text-xs text-amber-400 font-medium">RESISTANCE</span>
      <div class="text-3xl sm:text-4xl font-bold mt-1 text-white mono"><span id="valResistance">30</span><span class="text-xs text
